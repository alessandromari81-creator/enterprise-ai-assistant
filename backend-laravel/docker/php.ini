; Limiti PHP per l'upload dei PDF (il contratto prevede 20 MB).
upload_max_filesize = 20M
post_max_size = 22M
; pdfparser può usare molta memoria su PDF grandi.
memory_limit = 512M
; L'ingestione è sincrona e con un LLM locale può durare minuti.
max_execution_time = 600

; Un'API non deve mai scrivere warning nel corpo della risposta: rovinerebbero il JSON (e lo
; status). Esempio reale: un POST oltre post_max_size genera un warning prima ancora che parta
; Laravel. Gli errori vanno nel log (stderr del container), non nell'output.
display_errors = Off
html_errors = Off
log_errors = On
error_log = /proc/self/fd/2
