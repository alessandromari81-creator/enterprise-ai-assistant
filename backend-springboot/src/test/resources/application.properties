# Impostazioni SOLO per i test (si sommano a src/main/resources/application.yml e lo sovrascrivono).

# Gli embedding finti (bag of words) hanno similarità più bassa di quelli reali: soglia ridotta qui.
eaa.rag.min-score=0.2

# Nessun tentativo ripetuto: un errore del provider deve emergere subito, non dopo secondi di retry.
spring.ai.retry.max-attempts=1

# Niente log rumorosi di Hibernate/Spring AI durante i test.
logging.level.org.apache.pdfbox=ERROR
logging.level.org.apache.fontbox=ERROR
